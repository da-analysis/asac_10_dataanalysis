# ─────────────────────────────────────────────────────────────────────
# 재료명 alias 테이블
# 사용자/레시피 표기 → silver.ingredient.ingredient의 표준 (재료명, 단위)
#
# 형식:
#   <입력명>: {db_name: <DB 재료명>, db_unit: <DB 단위>}   # 매칭 사용
#   <입력명>: null                                          # ambiguous (자동 매칭 금지)
#
# 단위 선택 원칙:
#   1) 1kg 우선 (cost_calculator가 ₩/kg로 계산하므로 환산 단순)
#   2) 없으면 가장 작은 kg 단위 (대용량은 도매가/소매가 갭 큼)
#   3) kg 단위 자체가 없으면 개/마리/단/포기 (_PER_PIECE_GRAMS와 매칭 필요)
#
# 운영 원칙:
# - 카탈로그(silver.ingredient.ingredient distinct 결과)에 실제 있는 (재료명, 단위)만 매핑.
# - 카탈로그에 없는 가공품/조미료/육수는 null로 명시 → 곧장 네이버로 폴백.
# - archive 로그에서 unmatched_ingredients 자주 나오는 것부터 PR로 추가.
# ─────────────────────────────────────────────────────────────────────

